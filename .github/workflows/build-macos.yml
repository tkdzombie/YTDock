name: Build Downloader native macOS DMGs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: downloader-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION=$VERSION" >&2; exit 2; }
          test -f Sources/DownloaderApp.swift
          test ! -e Sources/app.js
          test ! -e Sources/NativeLauncher.swift
          grep -q '__DOWNLOADER_VERSION__' Sources/DownloaderApp.swift
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION=$VERSION" >&2
            exit 2
          fi

      - name: Build ${{ matrix.arch }} native DMG
        shell: zsh {0}
        run: |
          chmod +x Scripts/*.sh *.command
          ./Scripts/build-macos.sh "${{ matrix.arch }}"

      - name: Verify ${{ matrix.arch }} release
        shell: zsh {0}
        run: ./Scripts/verify-release.sh "${{ matrix.arch }}"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v7
        with:
          name: Downloader-${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          path: |
            build/free/${{ matrix.arch }}/Downloader-${{ steps.meta.outputs.version }}-${{ matrix.arch }}.dmg
            build/free/${{ matrix.arch }}/SHA256SUMS-${{ matrix.arch }}.txt
            build/free/${{ matrix.arch }}/BUILDINFO-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: meta
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Downloader-${{ steps.meta.outputs.version }}-arm64
          path: release-assets
          merge-multiple: true

      - name: Create combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          cat SHA256SUMS-arm64.txt > SHA256SUMS.txt
          ls -lah

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS=(
            "release-assets/Downloader-$VERSION-arm64.dmg"
            "release-assets/SHA256SUMS.txt"
            "release-assets/BUILDINFO-arm64.txt"
          )
          BODY="Downloader $VERSION is a native SwiftUI macOS release. This build targets Apple Silicon (arm64). Free builds are ad-hoc signed and are not Apple notarized. See README, SECURITY.md and the changelog in the repository for details."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --verify-tag \
              --title "Downloader $VERSION" \
              --notes "$BODY"
          fi
